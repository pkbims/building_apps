  <radialGradient id="tom" cx=".36" cy=".3" r=".78"><stop offset="0" stop-color="#ff8a66"/><stop offset=".5" stop-color="#ef4030"/><stop offset="1" stop-color="#b41f19"/></radialGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ade60"/><stop offset="1" stop-color="#3d963a"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter>
