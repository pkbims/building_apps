<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TITLE HERE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{--bg:#f4eee2;--panel:#fdf9f1;--ink:#2a2521;--muted:#6a6157;--faint:#978d82;
    --line:#e3d9c7;--accent:#b0523a;--soft:#f5e4dc;--warn:#7a5a1e;--warnsoft:#f3ead3;
    --quote:#efe7d6;--s1:6px;--s2:8px;--s3:10px;--s4:12px;--s5:16px;--s6:24px;--s7:32px;
    --r:10px;--r2:14px}
  :root{color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
    --bg:#1b1916;--panel:#242019;--ink:#ede4d6;--muted:#a89e8f;--faint:#766d60;
    --line:#38322a;--accent:#e28f72;--soft:#3b2a24;--warn:#dcb66e;--warnsoft:#302a1c;
    --quote:#2a2620}}
  :root[data-theme="dark"]{color-scheme:dark;
    --bg:#1b1916;--panel:#242019;--ink:#ede4d6;--muted:#a89e8f;--faint:#766d60;
    --line:#38322a;--accent:#e28f72;--soft:#3b2a24;--warn:#dcb66e;--warnsoft:#302a1c;
    --quote:#2a2620}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:18px/1.7 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  h1,h2,h3{letter-spacing:-.015em}
  header{position:sticky;top:0;z-index:60;background:var(--panel);
    border-bottom:1px solid var(--line);padding:var(--s4) var(--s6);
    display:flex;align-items:center;gap:var(--s5)}
  header h1{font-size:15px;margin:0;font-weight:650}
  .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);
    background:var(--soft);padding:3px var(--s2);border-radius:var(--s1);font-weight:650}
  .spacer{flex:1}.count{font-size:13px;color:var(--muted)}
  button.theme{background:var(--bg);border:1px solid var(--line);color:var(--muted);font:inherit;
    font-size:12px;padding:4px var(--s3);border-radius:var(--s2);cursor:pointer}
  button.theme:hover{color:var(--accent);border-color:var(--accent)}
  .layout{display:grid;grid-template-columns:206px minmax(0,1fr) 350px;gap:var(--s7);
    max-width:1400px;margin:0 auto;padding:var(--s6) var(--s6) 140px}
  @media(max-width:1200px){.layout{grid-template-columns:186px minmax(0,1fr)}
    /* narrow: the conversation slides in from the right instead of disappearing */
    aside.right{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);z-index:110;overflow-y:auto;
      border-radius:0;transform:translateX(105%);transition:transform .2s;box-shadow:-12px 0 40px rgba(0,0,0,.25)}
    aside.right.open{transform:none} #cpfab{display:flex!important} .topact{top:0}}
  #cpfab{display:none;position:fixed;right:16px;bottom:16px;z-index:111;align-items:center;gap:6px;border:0;
    border-radius:999px;padding:10px 16px;background:var(--accent);color:#fff;font:inherit;font-size:13px;font-weight:700;
    cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  #cpfab em{font-style:normal;background:#fff;color:var(--accent);border-radius:999px;padding:0 7px;font-size:11.5px}
  @media(max-width:820px){.layout{grid-template-columns:1fr}nav.toc{display:none}}
  nav.toc{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 110px);
    overflow-y:auto;font-size:13px}
  nav.toc .grp{color:var(--faint);text-transform:uppercase;letter-spacing:.07em;
    font-size:10.5px;font-weight:700;margin:var(--s5) 0 var(--s2)}
  nav.toc .grp:first-child{margin-top:0}
  nav.toc a{display:block;color:var(--muted);text-decoration:none;padding:5px var(--s3);
    border-left:2px solid transparent;border-radius:0 var(--s1) var(--s1) 0}
  nav.toc a.on{color:var(--accent);border-left-color:var(--accent);background:var(--soft);font-weight:600}
  section{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);
    padding:var(--s6) 28px;margin-bottom:var(--s6);position:relative;scroll-margin-top:84px}
  section:hover > .cbtn{opacity:1}
  section > h2{font-size:21px;margin:0 0 var(--s1)}
  .num{color:var(--faint);font-weight:600;font-size:14px;margin-right:var(--s2)}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 var(--s5)}
  blockquote{margin:var(--s3) 0;padding:var(--s3) var(--s5);background:var(--quote);
    border-left:2px solid var(--line);border-radius:0 var(--s2) var(--s2) 0;font-size:13.5px}
  .plain{background:var(--soft);border-left:3px solid var(--accent);padding:var(--s3) var(--s5);
    border-radius:0 var(--s2) var(--s2) 0;margin:var(--s4) 0;font-size:13.5px}
  .plain b{color:var(--accent)}
  .risk{background:var(--warnsoft);border-left:3px solid var(--warn);padding:var(--s3) var(--s5);
    border-radius:0 var(--s2) var(--s2) 0;margin:var(--s4) 0;font-size:13.5px}
  .risk b{color:var(--warn)}
  .cbtn{position:absolute;top:var(--s5);right:var(--s5);opacity:0;transition:opacity .15s;
    background:var(--bg);border:1px solid var(--line);color:var(--muted);font:inherit;
    font-size:12px;padding:4px var(--s3);border-radius:var(--s2);cursor:pointer}
  .cbtn:hover{color:var(--accent);border-color:var(--accent)}
  .cbtn.has{opacity:1;color:var(--accent);border-color:var(--accent);background:var(--soft)}
  .d{border:1px solid var(--line);border-radius:var(--r);padding:var(--s5) 18px;
    margin:var(--s5) 0;position:relative}
  .d:hover .cbtn{opacity:1}
  .d.open{border-left:3px solid var(--accent)}
  .q{font-weight:650;font-size:14.5px;margin-bottom:3px}
  .why{color:var(--muted);font-size:13px;margin-bottom:var(--s4)}
  label.opt{display:flex;gap:var(--s3);align-items:flex-start;padding:9px var(--s4);
    border:1px solid transparent;border-radius:var(--s2);cursor:pointer;font-size:14px}
  label.opt:hover{background:var(--bg)}
  label.opt.sel{border-color:var(--accent);background:var(--soft)}
  label.opt input{margin-top:3px;accent-color:var(--accent);flex:none}
  .oh{font-weight:550}.od{color:var(--muted);font-size:12.5px;display:block;margin-top:1px}
  .mm{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
    padding:18px;margin:var(--s4) 0;overflow-x:auto;text-align:center}
  table.t{width:100%;border-collapse:collapse;font-size:13px;margin:var(--s4) 0}
  table.t th,table.t td{border:1px solid var(--line);padding:var(--s2) var(--s3);
    text-align:left;vertical-align:top}
  table.t th{background:var(--bg);font-weight:650}
  code{background:var(--quote);padding:1px 5px;border-radius:5px;font-size:12.5px}
  pre.code{background:var(--quote);padding:var(--s5);border-radius:var(--r);
    overflow-x:auto;font-size:12.5px;margin:var(--s4) 0}
  details.ref{border:1px solid var(--line);border-radius:var(--r);padding:var(--s4) 18px;
    margin:var(--s4) 0;background:var(--bg)}
  details.ref summary{cursor:pointer;font-weight:650;font-size:14px;color:var(--accent)}
  /* The right column: decisions in brief, Send, then the page's conversation. It scrolls with the
     page (no box inside a box); only the Send block stays pinned. */
  aside.right{align-self:start;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r2);padding:var(--s5) 18px}
  aside.right h2{font-size:15px;margin:0}
  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:9px}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .dsum{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:4px}
  .dsum a{margin-left:auto;font-size:12px;color:var(--accent);cursor:pointer}
  #dchg{font-size:12px;border-left:3px solid var(--accent);background:var(--soft);border-radius:6px;
    padding:5px 9px;margin-top:8px} #dchg:empty{display:none} #dchg b{font-size:10.5px;letter-spacing:.05em}
  .dlist{margin:var(--s3) -4px 0;padding:0 4px;border-top:1px dashed var(--line)} .dlist[hidden]{display:none}
  .dr{display:flex;gap:9px;align-items:center;padding:5px var(--s2);border-radius:var(--s1);
    cursor:pointer;font-size:12.5px}
  .dr:hover{background:var(--bg)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
  .dr.done .dot{background:var(--accent)}
  .dn{color:var(--muted);font-weight:700;flex:none}
  .dr.todo .dv{color:var(--muted);font-style:italic}
  .topact{position:sticky;top:70px;z-index:5;background:var(--panel);padding:12px 0 8px;margin-top:6px;
    display:flex;flex-direction:column;gap:6px}
  .sendto{font-size:11.5px;color:var(--muted);text-align:center} .sendto b{color:var(--ink)}
  .sendto.busy b{color:var(--accent)}
  .pagec{font:inherit;font-size:12.5px;border:1px dashed var(--line);background:none;color:var(--muted);
    border-radius:10px;padding:7px;cursor:pointer} .pagec:hover{color:var(--accent);border-color:var(--accent)}
  #queue{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .sect{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:8px 2px 0}
  .th{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:9px 10px;font-size:13px}
  .th .hd{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:4px}
  .th .hd .where{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .th .hd .st{margin-left:0;white-space:nowrap}
  .th .hd a{color:var(--accent);cursor:pointer}
  .ktag{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;text-transform:uppercase;letter-spacing:.03em}
  .ktag.question{background:color-mix(in srgb,#3b82f6 16%,transparent);color:#3b82f6}
  .ktag.change{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
  .ktag.note{background:color-mix(in srgb,#22a55a 16%,transparent);color:#22a55a}
  .th .st{margin-left:auto;font-weight:700} .st.ok{color:#22a55a} .st.wait{color:var(--accent)}
  .th .msg{margin-top:7px;padding:7px 9px;border-radius:9px;line-height:1.5}
  .th .msg.claude{background:var(--soft)} .th .msg.you{border:1px solid var(--line);margin-left:16px}
  .th .msg .who{display:block;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
  .th .msg.claude .who{color:var(--accent)} .th .msg.you .who{color:var(--muted)}
  .th .msg code{background:var(--bg);padding:0 4px;border-radius:4px;font-size:12px}
  .th .msg ul{margin:4px 0 0 16px;padding:0}
  .th .act{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .th .act button,.th .rb button{font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);border-radius:8px;padding:3px 9px;cursor:pointer}
  .th .act button.pri,.th .rb button{background:var(--accent);border-color:var(--accent);color:#fff}
  .th .rb{display:flex;gap:6px;margin-top:8px}
  .th .rb input{flex:1;min-width:0;font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:8px;
    background:var(--panel);color:var(--ink);padding:5px 8px}
  .th .typing{font-size:12px;color:var(--muted);font-style:italic;margin-top:6px}
  .th.fold{padding:6px 10px;cursor:pointer} .th.fold:hover{border-color:var(--accent)}
  .th.fold .body{display:none}
  .th .row1{display:flex;gap:7px;align-items:center}
  .th .row1 .q1{flex:1;min-width:0}
  .th.fold .row1 .q1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
  .th .n{font-size:10.5px;color:var(--muted);white-space:nowrap}
  .th .wide{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px}
  #wideview{display:none;position:fixed;inset:6vh 10vw;z-index:120;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r2);padding:20px 24px;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  #wideview.on{display:block} #wideview .th{font-size:14px} #wideview .x{float:right;cursor:pointer;border:0;background:none;font-size:18px;color:var(--muted)}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:var(--s5) var(--s3)}
  /* Inside the App Maker the page's own header is hidden — the App Maker shows the round and the counts. */
  html.embedded header{display:none}
  html.embedded nav.toc{top:12px} html.embedded .topact{top:6px}
  html.embedded section{scroll-margin-top:16px}
  button.primary{width:100%;background:var(--accent);color:#fff;border:0;padding:11px;
    border-radius:var(--r);font:inherit;font-size:13.5px;font-weight:650;cursor:pointer}
  #pop{position:absolute;z-index:100;width:328px;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);
    box-shadow:0 10px 34px rgba(0,0,0,.18);display:none}
  #pop .pa{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--accent);font-weight:700;margin-bottom:var(--s2)}
  #pop .kind{display:flex;gap:var(--s2);margin-bottom:var(--s2)}
  #pop .kind label{flex:1;display:flex;gap:6px;align-items:center;font-size:12.5px;
    padding:5px var(--s2);border:1px solid var(--line);border-radius:var(--s2);cursor:pointer;color:var(--muted)}
  #pop .kind label.sel{border-color:var(--accent);background:var(--soft);color:var(--accent)}
  #pop .kind input{margin:0;accent-color:var(--accent)}
  #pop textarea{width:100%;min-height:88px;border:1px solid var(--line);border-radius:var(--s2);
    padding:9px;font:inherit;font-size:13.5px;background:var(--bg);color:var(--ink)}
  #pop .row{display:flex;gap:var(--s2);margin-top:var(--s3)}
  #pop button{flex:1;padding:var(--s2);border-radius:var(--s2);font:inherit;font-size:13px;
    cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  #pop button.add{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:650}
  /* "Claude is working" strip: shown after a round is sent, until the page is revised */
  #working{display:none;position:sticky;top:53px;z-index:55;background:var(--warnsoft);color:var(--warn);
    border-bottom:1px solid var(--line);padding:9px var(--s6);font-size:13.5px;align-items:center;gap:var(--s3)}
  #working.on{display:flex}
  #working.ready{background:var(--soft);color:var(--accent)}
  #working .spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;
    animation:wspin .8s linear infinite;flex:none}
  #working.ready .spin,#working.stale .spin{display:none}
  #working button{margin-left:auto;background:var(--accent);color:#fff;border:0;border-radius:var(--s2);
    padding:5px 12px;font:inherit;font-size:13px;font-weight:650;cursor:pointer;display:none}
  #working.ready button{display:inline-block}
  @keyframes wspin{to{transform:rotate(360deg)}}
  #toast{position:fixed;bottom:var(--s6);left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--bg);padding:var(--s3) 18px;border-radius:var(--s2);
    font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:200}
  #toast.on{opacity:1}
  .flash{animation:fl 1.1s ease-out}
  @keyframes fl{0%{background:var(--soft)}100%{background:transparent}}
  [data-changed]{box-shadow:inset 3px 0 0 var(--warn)}
  [data-changed]::before{content:"changed · round " attr(data-changed);position:absolute;top:-9px;left:12px;
    font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--warn);
    background:var(--warnsoft);padding:2px 7px;border-radius:5px;z-index:1}
  nav.toc .chg a{color:var(--warn)} nav.toc .chg a.on{color:var(--warn);border-left-color:var(--warn);background:var(--warnsoft)}
  nav.toc .chg .grp{color:var(--warn)}
</style>
<script id="theme">
try{if(window.top!==window)document.documentElement.classList.add('embedded')}catch(e){document.documentElement.classList.add('embedded')}
(()=>{const K='theme',R=document.documentElement,L={'':'Auto',light:'Light',dark:'Dark'};
const set=v=>{v?R.dataset.theme=v:delete R.dataset.theme;try{v?localStorage.setItem(K,v):localStorage.removeItem(K)}catch(e){}};
try{set(localStorage.getItem(K)||'')}catch(e){}
addEventListener('DOMContentLoaded',()=>{const h=document.querySelector('header');if(!h)return;
  const b=document.createElement('button');b.className='theme';b.title='Auto → Light → Dark';
  const show=()=>b.textContent=L[R.dataset.theme||''];
  b.onclick=()=>{const c=['','light','dark'];set(c[(c.indexOf(R.dataset.theme||'')+1)%3]);show()};
  show();h.appendChild(b)})})();
</script>
</head>
<body>
<header>
  <h1>TITLE HERE</h1>
  <span class="tag" id="round">Round 1</span>
  <div class="spacer"></div>
  <span class="count" id="dcount">—</span>
</header>

<div id="working"><span class="spin"></span><span id="wtext"></span><button id="wreload">Reload</button></div>
<div class="layout">
<nav class="toc" id="toc"></nav>
<main>

<!--
  CONTENT GOES HERE.

  <section id="s-x" data-anchor="x" data-label="Short name"
           data-group="Group" data-title="Nav title">
    <button class="cbtn">comment</button>
    <h2><span class="num">1</span>Heading</h2>
    ...
    <div class="d open" data-anchor="d1" data-label="D1 the question">
      <button class="cbtn">comment</button>
      <div class="q">D1 — The question</div>
      <div class="why">Why it matters.</div>
      <div data-radio="d1">
        <label class="opt"><input type="radio" name="d1" value="a">
          <span><span class="oh">Option A</span><span class="od">Trade-off.</span></span></label>
      </div>
    </div>
  </section>
-->

</main>

<aside class="right">
  <h2>Decisions</h2>
  <div class="dsum"><span id="dprog">—</span><a id="dtoggle">show all</a></div>
  <div class="bar"><i id="dbar" style="width:0"></i></div>
  <div id="dchg"></div>
  <div class="dlist" id="dlist" hidden></div>
  <div class="topact">
    <button class="primary" id="send">Send</button>
    <div class="sendto" id="sendto"></div>
    <button class="pagec" id="pagec">💬 Comment on the whole page</button>
  </div>
  <div id="queue"></div>
</aside>
<div id="wideview"></div>
<button id="cpfab">💬 Conversation</button>
</div>

<div id="pop">
  <div class="pa" id="popanchor"></div>
  <div class="kind">
    <label class="sel"><input type="radio" name="kind" value="question" checked> Ask a question</label>
    <label><input type="radio" name="kind" value="change"> Change this</label>
    <label><input type="radio" name="kind" value="note"> Comment</label>
  </div>
  <textarea id="poptext" placeholder="What do you want to know? Answered right here, in the panel."></textarea>
  <div class="row"><button id="popcancel">Cancel</button><button id="popadd" class="add">Send now</button></div>
</div>
<div id="toast"></div>

<!-- optional: <script src="vendor/mermaid.min.js"></script> for <pre class="mermaid"> diagrams -->
<script>
const S={decisions:{},comments:[],batches:[]}; let ROUND=1;
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),1700)};
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(b)}).then(r=>r.json());
const D=k=>S.decisions[k];
function groups(){return [...document.querySelectorAll('[data-radio],[data-check]')]}

function buildChanged(){
  // Blocks the author marked data-changed="N" (N = the round they were revised in).
  // The rail lists the latest round's blocks so the reviewer can find what moved.
  const els=[...document.querySelectorAll('[data-changed]')]; if(!els.length) return;
  const latest=Math.max(...els.map(e=>+e.dataset.changed));
  const mine=els.filter(e=>+e.dataset.changed===latest);
  $('#toc').insertAdjacentHTML('afterbegin',`<div class="chg"><div class="grp">Changed in round ${latest} (${mine.length})</div>`+
    mine.map((e,i)=>{ if(!e.id) e.id='chg-'+latest+'-'+i;
      return `<a href="#${e.id}" data-id="${e.id}">${esc(e.dataset.label||e.dataset.title||e.id)}</a>`}).join('')+
    `<div class="grp" style="margin-top:10px">Contents</div></div>`);
  document.querySelectorAll('#toc .chg a').forEach(a=>a.onclick=ev=>{ev.preventDefault();
    const el=document.getElementById(a.dataset.id); el.scrollIntoView({behavior:'smooth',block:'center'});
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash')});
}
function buildToc(){
  let last='';
  $('#toc').innerHTML=[...document.querySelectorAll('main section')].map(s=>{
    let out=''; if(s.dataset.group!==last){out+=`<div class="grp">${s.dataset.group}</div>`;last=s.dataset.group}
    return out+`<a href="#${s.id}" data-id="${s.id}">${s.dataset.title}</a>`}).join('');
  const links=[...document.querySelectorAll('#toc a')];
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting)
    links.forEach(l=>l.classList.toggle('on',l.dataset.id===e.target.id)) }),
    {rootMargin:'-84px 0px -70% 0px'});
  document.querySelectorAll('main section').forEach(s=>io.observe(s));
}
function renderDecisions(){
  const gs=groups(); let done=0;
  const label=(id)=>{const g=gs.find(x=>(x.dataset.radio||x.dataset.check)===id);if(!g)return null;
    const ch=[...g.querySelectorAll('input:checked')];return ch.map(i=>i.closest('label').querySelector('.oh').textContent).join(', ')};
  $('#dlist').innerHTML=gs.map(g=>{
    const id=g.dataset.radio||g.dataset.check, blk=g.closest('.d');
    const ch=[...g.querySelectorAll('input:checked')]; if(ch.length) done++;
    const val=ch.map(i=>i.closest('label').querySelector('.oh').textContent).join(', ');
    return `<div class="dr ${ch.length?'done':'todo'}" data-goto="${blk?blk.dataset.anchor:''}">
      <span class="dot"></span><span class="dn">${id.toUpperCase()}</span>
      <span class="dv">${esc(val||'not decided')}</span></div>`}).join('');
  $('#dprog').innerHTML=gs.length?(done===gs.length?`<b style="color:#22a55a">✓ ${done} of ${gs.length} decided</b>`:`${done} of ${gs.length} decided`):'No decisions on this page';
  $('#dtoggle').style.display=gs.length?'':'none';
  $('#dbar').style.width=(gs.length?done/gs.length*100:0)+'%';
  // what changed since the last round was sent
  const last=(S.batches[S.batches.length-1]||{}).decisions||{};
  const chg=gs.map(g=>g.dataset.radio||g.dataset.check).filter(id=>JSON.stringify(S.decisions[id]??null)!==JSON.stringify(last[id]??null)&&S.decisions[id]!=null);
  $('#dchg').innerHTML=chg.length?`<b>CHANGED SINCE LAST ROUND:</b> `+chg.map(id=>`${id.toUpperCase()} → ${esc(label(id)||'')}`).join(' · '):'';
  $('#dcount').textContent=`${done}/${gs.length} decided · ${S.comments.filter(c=>c.status==='queued').length} queued`;
  document.querySelectorAll('.dr').forEach(r=>r.onclick=()=>{
    const el=document.querySelector(`[data-anchor="${r.dataset.goto}"]`); if(!el)return;
    el.scrollIntoView({behavior:'smooth',block:'center'});
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash')});
  report();
}
$('#cpfab').onclick=()=>$('aside.right').classList.toggle('open');
$('#dtoggle').onclick=()=>{const l=$('#dlist');l.hidden=!l.hidden;$('#dtoggle').textContent=l.hidden?'show all':'hide'};
// ---- The page's conversation: every comment is a small thread; answers come back here, not to the terminal ----
let AGENT={agent:null,status:null}, openIds=new Set();
const md=t=>esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/(^|\n)- (.+)/g,'$1<li>$2</li>').replace(/(<li>.*<\/li>)/s,'<ul>$1</ul>').replace(/\n/g,'<br>');
const KL={question:'Question',change:'Change',note:'Note'};
const ago=t=>{if(!t)return'';const s=(Date.now()-new Date(t))/1000;return s<60?'now':s<3600?Math.round(s/60)+'m ago':s<86400?Math.round(s/3600)+'h ago':new Date(t).toLocaleDateString()};
function stateOf(c){const m=c.messages||[], last=m[m.length-1];
  if(c.status==='queued')return['wait','queued — not sent'];
  if(c.suggest)return['ok','answered — your call'];
  if(last&&last.from==='claude')return['ok','✓'];
  if(c.addressed)return['ok',c.kind==='change'?'✓ done':'✓ taken on board'];
  return['wait',AGENT.status==='working'?'Claude is busy — you\'re next':'waiting for Claude']}
function waiting(c){const [cls,txt]=stateOf(c);return c.status==='queued'||c.suggest||cls==='wait'}
function item(c,wide){
  const [cls,txt]=stateOf(c), m=c.messages||[], where=c.anchor==='page'?'whole page':`on <a data-goto="${esc(c.anchor)}">${esc(c.anchorLabel||c.anchor)}</a>`;
  const fold=!wide&&!waiting(c)&&!openIds.has(c.id);
  const kind=c.kind||'change';
  const body=`<div class="body">`+m.map(x=>`<div class="msg ${x.from==='claude'?'claude':'you'}"><span class="who">${x.from==='claude'?'Claude':'You'} · ${ago(x.t)}</span>${md(x.text||'')}</div>`).join('')+
    (c.status==='queued'?`<div class="act"><button data-del="${c.id}">Delete</button></div>`:
     (c.suggest?`<div class="act"><button class="pri" data-mkchange="${c.id}">Make it a change request</button><button data-nothanks="${c.id}">No thanks</button></div>`:'')+
     (!m.length||m[m.length-1].from!=='you'?'':'<div class="typing">'+(AGENT.status==='working'?'Claude is busy — your message is next.':'Claude is answering…')+'</div>')+
     `<div class="rb"><input data-rin="${c.id}" placeholder="Reply…"><button data-rsend="${c.id}">Reply</button></div>`)+`</div>`;
  return `<div class="th ${fold?'fold':''}" data-th="${c.id}"><div class="hd"><span class="ktag ${kind}">${KL[kind]||'Change'}</span><span class="where" title="${esc(c.anchorLabel||'')}">${where}</span>
      <span class="st ${cls}">${txt}${m.length>1?` · ${m.length+1} msgs`:''}</span>${wide?'':`<button class="wide" data-wide="${c.id}" title="Open wide">⤢</button>`}</div>
    <div class="row1"><span class="q1">${fold?esc(c.text):md(c.text||'')}</span></div>${body}</div>`}
function renderQueue(){
  const q=S.comments.filter(c=>c.status==='queued');
  const nd=Object.keys(S.decisions).length;
  $('#send').textContent=q.length?`Send ${q.length} change${q.length===1?'':'s'} + decisions`:`Send decisions (round ${ROUND})`;
  $('#sendto').innerHTML=AGENT.agent?`→ <b>${esc(AGENT.agent)}</b>${AGENT.status?` · ${esc(AGENT.status)}`:''}`:'→ the Claude session in the terminal';
  $('#sendto').className='sendto'+(AGENT.status==='working'?' busy':'');
  const all=[...S.comments].reverse(), wait=all.filter(waiting), done=all.filter(c=>!waiting(c));
  if(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.rin)return;   // don't redraw under a reply being typed
  $('#queue').innerHTML=(all.length?'':'<div class="empty">No comments yet.<br>Hover any block and press <em>comment</em>, or comment on the whole page.</div>')+
    (wait.length?'<div class="sect">Waiting</div>'+wait.map(c=>item(c)).join(''):'')+
    (done.length?'<div class="sect">Answered — click to open</div>'+done.map(c=>item(c)).join(''):'');
  wireThread($('#queue'));
  const nw=wait.length; $('#cpfab').innerHTML='💬 Conversation'+(nw?` <em>${nw}</em>`:'');
  report();
}
function wireThread(root){
  root.querySelectorAll('[data-th]').forEach(el=>el.onclick=e=>{if(e.target.closest('button,input,a'))return;
    const id=el.dataset.th; if(el.classList.contains('fold')){openIds.add(id)}else if(!waiting(S.comments.find(c=>c.id===id)||{})){openIds.delete(id)} renderQueue()});
  root.querySelectorAll('[data-goto]').forEach(a=>a.onclick=()=>{const el=document.querySelector(`[data-anchor="${a.dataset.goto}"]`);
    if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}});
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const r=await post('/api/comment/delete',{id:b.dataset.del});
    S.comments=r.comments;renderQueue();markAnchors();renderDecisions()});
  root.querySelectorAll('[data-rsend]').forEach(b=>{const id=b.dataset.rsend, inp=root.querySelector(`[data-rin="${id}"]`);
    const go=async()=>{const t=inp.value.trim();if(!t)return;inp.blur();const r=await post('/api/reply',{id,text:t});
      if(r.comments)S.comments=r.comments;openIds.add(id);renderQueue();toast(AGENT.agent?'Sent to '+AGENT.agent:'Sent')};
    b.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()}});
  root.querySelectorAll('[data-mkchange]').forEach(b=>b.onclick=async()=>{const c=S.comments.find(x=>x.id===b.dataset.mkchange);
    const m=c.messages||[], ans=[...m].reverse().find(x=>x.from==='claude');
    await post('/api/comment',{id:'c'+Date.now(),anchor:c.anchor,anchorLabel:c.anchorLabel,anchorText:c.anchorText||'',kind:'change',
      text:`From the conversation “${c.text}”: ${ans?ans.text:''}`});
    const r=await post('/api/comment/update',{id:c.id,fields:{suggest:false}});S.comments=r.comments;renderQueue();markAnchors();renderDecisions();
    toast('Added as a change — it goes with Send')});
  root.querySelectorAll('[data-nothanks]').forEach(b=>b.onclick=async()=>{const r=await post('/api/comment/update',{id:b.dataset.nothanks,fields:{suggest:false}});
    S.comments=r.comments;renderQueue()});
  root.querySelectorAll('[data-wide]').forEach(b=>b.onclick=()=>{const c=S.comments.find(x=>x.id===b.dataset.wide);
    const w=$('#wideview');w.innerHTML='<button class="x">×</button>'+item(c,true);w.classList.add('on');
    w.querySelector('.x').onclick=()=>w.classList.remove('on');wireThread(w)});
}
// Tell the App Maker (when this page is inside it) the round and counts it shows in its own header.
function report(){try{if(window.top===window)return;const gs=groups();
  const done=gs.filter(g=>g.querySelector('input:checked')).length;
  window.parent.postMessage({type:'am-page',title:(document.querySelector('header h1')||{}).textContent||document.title,
    round:ROUND,decided:done,total:gs.length,queued:S.comments.filter(c=>c.status==='queued').length,
    waiting:S.comments.filter(waiting).length},'*')}catch(e){}}
function markAnchors(){
  document.querySelectorAll('[data-anchor]').forEach(el=>{
    const has=S.comments.some(c=>c.anchor===el.dataset.anchor&&c.status==='queued');
    const b=el.querySelector(':scope > .cbtn');
    if(b){b.classList.toggle('has',has); b.textContent=has?'commented':'comment'}});
}
const PH={change:'What is wrong, missing, or should change here? Waits for Send.',
          question:'What do you want to know? Answered right here, in the panel.',
          note:'A thought, context or reaction. Goes straight away; the page only changes if you ask.'};
const kind=()=>$('#pop input[name=kind]:checked').value;
function setKind(k){$(`#pop input[name=kind][value="${k}"]`).checked=true;
  document.querySelectorAll('#pop .kind label').forEach(l=>l.classList.toggle('sel',l.querySelector('input').value===k));
  $('#poptext').placeholder=PH[k]; $('#popadd').textContent=k==='change'?'Add to queue':'Send now'}
let target=null;
document.addEventListener('click',e=>{
  const btn=e.target.closest('.cbtn');
  if(!btn){ if(!e.target.closest('#pop')&&!e.target.closest('#pagec')) $('#pop').style.display='none'; return }
  const el=btn.closest('[data-anchor]');
  target={anchor:el.dataset.anchor,label:el.dataset.label,
          text:(el.querySelector('h2,.q')||{}).textContent||''};
  const p=$('#pop'),r=btn.getBoundingClientRect();
  $('#popanchor').textContent=target.label; $('#poptext').value=''; setKind('question');
  p.style.display='block'; p.style.top=(window.scrollY+r.bottom+8)+'px';
  p.style.left=Math.max(12,Math.min(r.right-328+window.scrollX,document.body.clientWidth-340))+'px';
  $('#poptext').focus();
});
$('#popcancel').onclick=()=>$('#pop').style.display='none';
$('#popadd').onclick=async()=>{
  const t=$('#poptext').value.trim(); if(!t||!target)return;
  const k=kind(), now=k!=='change';
  const r=await post('/api/comment',{id:'c'+Date.now(),anchor:target.anchor,
    anchorLabel:target.label,anchorText:target.text,text:t,kind:k,now});
  S.comments=r.comments; $('#pop').style.display='none';
  renderQueue(); markAnchors(); renderDecisions(); toast(now?(AGENT.agent?'Sent to '+AGENT.agent:'Sent'):'Queued — goes with Send')};
// "Comment on the whole page": the same popup, pinned to the page instead of a block
$('#pagec').onclick=e=>{e.stopPropagation();target={anchor:'page',label:'Whole page',text:''};
  const p=$('#pop'),r=$('#pagec').getBoundingClientRect();$('#popanchor').textContent='The whole page';$('#poptext').value='';setKind('question');
  p.style.display='block';p.style.top=(window.scrollY+r.bottom+8)+'px';p.style.left=Math.max(12,r.right-328+window.scrollX)+'px';$('#poptext').focus()};
// ---- "Claude is working" indicator ----
// After a send, poll until the page file changes (Claude rebuilt it) or every comment in that
// round is marked addressed. Survives a reload (localStorage), so a page that reloads itself
// after sending (e.g. a stage gate) still shows it.
const WK='working:'+location.pathname;
const lastMod=()=>fetch(location.pathname,{method:'HEAD',cache:'no-store'}).then(r=>r.headers.get('Last-Modified')||'').catch(()=>'');
function wset(cls,text){const w=$('#working');w.className='on '+cls;$('#wtext').innerHTML=text}
async function markWorking(round){const lm=await lastMod();
  try{localStorage.setItem(WK,JSON.stringify({round,lm,t:Date.now()}))}catch(e){}
  wset('',`<b>Claude is working on round ${round}…</b> Your comments and decisions are sent. This bar changes when the revision is ready.`);pollWorking()}
window.markWorking=markWorking;
let wtimer=null;
function pollWorking(){clearTimeout(wtimer);let w;try{w=JSON.parse(localStorage.getItem(WK)||'null')}catch(e){w=null}
  if(!w)return;
  wtimer=setTimeout(async()=>{const lm=await lastMod();
    const st=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
    // this round's comments only: the batch records their ids
    const b=st?(st.batches||[])[w.round-1]:null;const ids=new Set((b&&b.commentIds)||[]);
    const mine=st?(st.comments||[]).filter(c=>ids.has(c.id)):[];
    const allDone=mine.length>0&&mine.every(c=>c.addressed);
    if((lm&&w.lm&&lm!==w.lm)||allDone){try{localStorage.removeItem(WK)}catch(e){}
      wset('ready',`<b>Round ${w.round} revision is ready.</b> Reload to see what changed — it's listed at the top of the left rail.`);return}
    if(Date.now()-w.t>4*60*1000){wset('stale',`<b>Still waiting on round ${w.round}.</b> If nothing arrives, type “sent” in the terminal — the automatic wake-up may have missed it.`)}
    pollWorking()},4000)}
$('#wreload').onclick=()=>location.reload();

$('#send').onclick=async()=>{
  const r=await post('/api/send',{});
  S.comments.forEach(c=>{if(c.status==='queued')c.status='sent'});
  ROUND+=1; $('#round').textContent=`Round ${ROUND}`;
  renderQueue(); markAnchors(); renderDecisions();
  toast(`Round ${ROUND-1} sent — ${r.sent} comment${r.sent===1?'':'s'} + decisions`);
  markWorking(ROUND-1)};
document.addEventListener('change',async e=>{
  const i=e.target;
  if(i.closest('#pop')){ if(i.name==='kind') setKind(i.value); return }
  if(i.type==='radio'){S.decisions[i.name]=i.value; await post('/api/decision',{id:i.name,value:i.value})}
  else if(i.type==='checkbox'){
    const v=[...document.querySelectorAll(`input[name="${i.name}"]:checked`)].map(x=>x.value);
    S.decisions[i.name]=v; await post('/api/decision',{id:i.name,value:v})}
  else return;
  document.querySelectorAll('label.opt').forEach(l=>l.classList.toggle('sel',l.querySelector('input').checked));
  renderDecisions(); toast('Saved')});

async function refresh(){try{
  const [st,ag]=await Promise.all([fetch('/api/state',{cache:'no-store'}).then(r=>r.json()),fetch('/api/agent',{cache:'no-store'}).then(r=>r.json()).catch(()=>({}))]);
  AGENT=ag||{}; const before=JSON.stringify(S.comments); S.comments=st.comments||[]; S.batches=st.batches||[];
  if(JSON.stringify(S.comments)!==before||true)renderQueue();}catch(e){}}
setInterval(refresh,6000);
fetch('/api/agent').then(r=>r.json()).then(a=>{AGENT=a||{};renderQueue()}).catch(()=>{});
fetch('/api/state').then(r=>r.json()).then(async st=>{
  S.decisions=st.decisions||{}; S.comments=st.comments||[]; S.batches=st.batches||[];
  ROUND=S.batches.length+1; $('#round').textContent=`Round ${ROUND}`;
  for(const [k,v] of Object.entries(S.decisions))
    (Array.isArray(v)?v:[v]).forEach(val=>{
      const i=document.querySelector(`input[name="${k}"][value="${val}"]`); if(i)i.checked=true});
  document.querySelectorAll('label.opt').forEach(l=>l.classList.toggle('sel',l.querySelector('input').checked));
  post('/api/groups',{groups:groups().map(g=>g.dataset.radio||g.dataset.check)});
  buildToc(); buildChanged(); renderQueue(); markAnchors(); renderDecisions();
  pollWorking();  // a round sent before a reload keeps its "working" bar
  if(window.mermaid){mermaid.initialize({startOnLoad:false,
    theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'neutral',securityLevel:'loose'});
    try{await mermaid.run({nodes:[...document.querySelectorAll('pre.mermaid')]})}catch(e){}}
});
</script>
